
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build APK from HTML
        uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "My First Game"
          app_id: "com.myfirstgame.racing"
          web_dir: "."
          
